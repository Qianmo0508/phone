<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>渠京 OS</title>
<style>
:root{
  --fs:15px; --status-h:44px;
  --bg:#f2f2f7; --text:#0b0b0f; --text2:#8a8a8e; --text3:#b6b6bd;
  --line:rgba(60,60,67,.12); --card:#fff; --card2:#f4f4f7;
  --nav-bg:rgba(247,247,250,.92); --tint:#0a84ff; --tint-soft:rgba(10,132,255,.12);
  --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --r:16px; --sh:0 4px 16px rgba(0,0,0,.08); --sh-lg:0 18px 50px rgba(0,0,0,.28);
  --ease:cubic-bezier(.32,.72,0,1); --dur:280ms;
}
[data-theme="dark"]{
  --bg:#000;--text:#fff;--text2:#8e8e93;--text3:#5a5a5f;
  --line:rgba(255,255,255,.13);--card:#1c1c1e;--card2:#2c2c2e;
  --nav-bg:rgba(28,28,30,.9);--tint-soft:rgba(10,132,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#0b0b12;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 18%,#22222e 0%,#0b0b12 68%);}
#phone{position:relative;width:390px;height:844px;border-radius:46px;background:#000;
  box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 0 10px #1a1a1e,0 0 0 12px #303036;overflow:hidden;flex:0 0 auto;transform-origin:center center;}
@media (max-width:520px),(max-height:700px){#phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;}#stage{background:#000;}}
#screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;touch-action:pan-y;}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;}
input,textarea,select{font:inherit;color:inherit;}
svg.ic{width:1em;height:1em;fill:currentColor;display:block;flex:0 0 auto;}
#wallpaper{position:absolute;inset:0;z-index:0;transition:background .5s var(--ease);}
#wallpaper::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.32),transparent 45%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.16),transparent 50%);}
#statusbar{position:absolute;top:0;left:0;right:0;z-index:40;height:calc(var(--status-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 22px 0;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:600;pointer-events:none;color:var(--text);}
.sb-right{display:flex;align-items:center;gap:5px;}
.batt-box{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9;}
.batt-box::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0;}
.batt-fill{position:absolute;inset:1.4px;width:78%;background:currentColor;border-radius:1.5px;}
/* 锁屏 */
#lock-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  padding:calc(var(--status-h) + env(safe-area-inset-top) + 26px) 24px 30px;color:#fff;
  transition:transform .45s var(--ease),opacity .35s;text-shadow:0 2px 14px rgba(0,0,0,.35);}
#lock-screen.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
.lock-time{font-size:74px;font-weight:250;letter-spacing:-3px;line-height:1;}
.lock-date{font-size:16px;opacity:.92;margin-top:8px;font-weight:500;}
.lock-notifs{margin-top:auto;display:flex;flex-direction:column;gap:9px;}
.lock-notif{background:rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:16px;padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.lock-notif .dot{width:8px;height:8px;border-radius:50%;background:#fff;margin-top:6px;flex:0 0 auto;opacity:.9;}
.lock-hint{text-align:center;font-size:13px;opacity:.8;margin-top:18px;animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#lock-keypad{position:absolute;inset:0;z-index:22;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;
  background:rgba(0,0,0,.34);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
#lock-keypad.show{display:flex;}
.pw-dots{display:flex;gap:14px;margin-bottom:6px;}
.pw-dot{width:12px;height:12px;border-radius:50%;border:1.6px solid #fff;transition:background .18s;}
.pw-dot.on{background:#fff;}
.pw-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
.pw-key{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:26px;display:grid;place-items:center;transition:transform .12s,background .12s;}
.pw-key:active{transform:scale(.92);background:rgba(255,255,255,.36);}
.pw-key.blank{background:transparent;pointer-events:none;}
/* 桌面 */
#home{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding-top:calc(var(--status-h) + env(safe-area-inset-top));transition:opacity .3s,transform .35s var(--ease);}
#home.hide{opacity:0;pointer-events:none;transform:scale(.96);}
#dpages{flex:1;display:flex;transition:transform .34s var(--ease);}
#dpages.dragging{transition:none;}
.dpage{flex:0 0 100%;width:100%;padding:6px 16px 4px;overflow-y:auto;overflow-x:hidden;}
.widget{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.24);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:16px 18px;color:#fff;
  margin:4px 2px 18px;box-shadow:0 6px 20px rgba(0,0,0,.12);text-shadow:0 1px 8px rgba(0,0,0,.2);}
.w-time{font-size:38px;font-weight:300;letter-spacing:-1.5px;line-height:1;}
.w-date{font-size:12px;opacity:.9;margin-top:5px;}
.w-temp{font-size:30px;font-weight:300;line-height:1;text-align:right;}
.w-city{font-size:12px;opacity:.9;margin-top:5px;text-align:right;}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;color:#fff;font-size:11px;
  text-shadow:0 1px 3px rgba(0,0,0,.45);transition:transform .16s var(--ease);}
.app-icon:active{transform:scale(.9);}
.app-icon .glyph{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;
  box-shadow:0 5px 14px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden;}
.app-icon .glyph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);}
.app-icon .label{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 5px;z-index:2;}
#dots{display:flex;justify-content:center;gap:7px;padding:8px 0 4px;}
.dot-ind{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.42);}
.dot-ind.on{background:#fff;}
#dock{margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:10px 8px;border-radius:30px;
  display:flex;justify-content:space-around;background:rgba(255,255,255,.22);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 26px rgba(0,0,0,.16);}
#dock .app-icon .label{display:none;}
/* 页面 */
#pages-layer{position:absolute;inset:0;z-index:5;pointer-events:none;}
.page{position:absolute;inset:0;pointer-events:auto;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
  padding-top:calc(var(--status-h) + env(safe-area-inset-top));transform:translateX(100%);transition:transform var(--dur) var(--ease),opacity var(--dur);}
.page.in{transform:translateX(0);}
.page.out{transform:translateX(100%);}
.page.behind{transform:translateX(-24%);opacity:.75;}
.nav{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;min-height:46px;position:relative;background:var(--bg);z-index:2;}
.nav-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:20px;color:var(--tint);flex:0 0 auto;transition:background .18s;}
.nav-btn:active{background:var(--tint-soft);}
.nav-title{flex:1;font-size:17px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.nav-right{min-width:36px;display:flex;justify-content:flex-end;gap:4px;}
.page-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:26px;}
.page-body::-webkit-scrollbar{width:0;}
.pad{padding:0 16px;}
.section-title{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.4px;padding:18px 16px 8px;}
.list{background:var(--card);border-radius:var(--r);margin:0 16px;overflow:hidden;}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--line);transition:background .16s;}
.list-item:last-child{border-bottom:0;}
.list-item:active{background:var(--card2);}
.li-main{flex:1;min-width:0;}
.li-title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-sub{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.li-time{font-size:11.5px;color:var(--text3);flex:0 0 auto;align-self:flex-start;margin-top:3px;}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px;background:hsl(var(--h,200) 62% 55%);}
.avatar.sm{width:32px;height:32px;font-size:13px;}
.avatar.lg{width:64px;height:64px;font-size:24px;}
.btn{border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;background:var(--card2);color:var(--text);
  transition:transform .14s var(--ease),opacity .14s;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;}
.btn:active{transform:scale(.96);opacity:.85;}
.btn.primary{background:var(--tint);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn.ghost{background:var(--card2);color:var(--tint);}
.btn.wide{width:100%;margin-top:14px;min-height:46px;}
.btn.sm{padding:6px 12px;min-height:32px;font-size:12.5px;border-radius:9px;}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;outline:none;transition:border-color .18s;resize:vertical;}
.field:focus{border-color:var(--tint);}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:48px 24px;}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.5;}
.row{display:flex;gap:10px;align-items:center;}
.spacer{flex:1;}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--tint-soft);color:var(--tint);font-weight:600;white-space:nowrap;}
/* 聊天 */
.chat-scroll{flex:1;overflow-y:auto;padding:10px 14px 8px;-webkit-overflow-scrolling:touch;}
.bubble-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:8px;}
.bubble-row.me{flex-direction:row-reverse;}
.bubble{max-width:74%;padding:9px 13px;border-radius:17px;font-size:14.5px;word-break:break-word;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative;line-height:1.42;white-space:pre-wrap;}
.bubble-row.me .bubble{background:var(--tint);color:#fff;}
.bubble-row.them .bubble{border-bottom-left-radius:5px;}
.bubble-row.me .bubble{border-bottom-right-radius:5px;}
.bubble .meta{font-size:10.5px;opacity:.6;margin-top:4px;text-align:right;}
.chat-inputbar{display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);}
.chat-input{flex:1;background:var(--card2);border-radius:19px;padding:10px 14px;font-size:15px;outline:none;border:1px solid transparent;min-height:40px;}
.chat-input:focus{border-color:var(--tint);}
.send-btn{background:var(--tint);color:#fff;border-radius:19px;padding:0 16px;height:40px;font-size:14px;font-weight:600;transition:transform .14s var(--ease);}
.send-btn:active{transform:scale(.94);}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:19px;flex:0 0 auto;}
.round:active{transform:scale(.92);}
/* 计算器 */
.calc-display{padding:26px 22px 12px;text-align:right;font-size:46px;font-weight:250;letter-spacing:-1px;min-height:100px;word-break:break-all;line-height:1.1;}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 14px 20px;}
.calc-key{height:66px;border-radius:33px;background:var(--card);font-size:23px;font-weight:500;display:grid;place-items:center;transition:transform .12s var(--ease),background .12s;}
.calc-key:active{transform:scale(.94);background:var(--card2);}
.calc-key.op{background:var(--orange);color:#fff;}
.calc-key.fn{background:var(--card2);color:var(--tint);}
/* 论坛 */
.chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);font-size:13px;white-space:nowrap;border:1px solid var(--line);transition:all .18s;font-weight:500;}
.chip.on{background:var(--tint);color:#fff;border-color:var(--tint);}
.post-card{background:var(--card);border-radius:var(--r);margin:0 16px 10px;padding:14px;box-shadow:var(--sh);transition:transform .16s var(--ease);}
.post-card:active{transform:scale(.985);}
.post-title{font-size:15.5px;font-weight:600;line-height:1.35;margin-bottom:6px;}
.post-excerpt{font-size:13px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-foot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--text2);}
.act-btn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--text2);padding:4px 8px;border-radius:8px;transition:background .16s;}
.act-btn:active{background:var(--card2);}
.act-btn.on{color:var(--red);}
.act-btn .ic{font-size:14px;}
.comment{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
.comment .body{flex:1;min-width:0;}
.comment .name{font-size:12.5px;color:var(--text2);font-weight:600;}
.comment .txt{font-size:14px;margin-top:3px;word-break:break-word;line-height:1.45;white-space:pre-wrap;}
.lvl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.5px;}
.lvl.S{background:rgba(52,199,89,.15);color:#2f9e44;}
.lvl.P{background:rgba(255,149,0,.15);color:#d97b00;}
.lvl.C{background:rgba(255,59,48,.15);color:#d93b30;}
.lvl.A{background:rgba(175,82,222,.15);color:#8e3fc0;}
.lvl.N{background:rgba(120,120,128,.15);color:#787880;}
/* 开关 */
.switch{width:50px;height:30px;border-radius:15px;background:var(--card2);position:relative;transition:background .22s;flex:0 0 auto;border:1px solid var(--line);}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s var(--ease);}
.switch.on{background:var(--green);border-color:var(--green);}
.switch.on::after{transform:translateX(20px);}
/* 面板 */
.panel{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .26s;}
.panel.open{pointer-events:auto;opacity:1;}
.panel-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.panel-sheet{position:absolute;left:0;right:0;top:0;max-height:88%;padding:calc(var(--status-h) + env(safe-area-inset-top) + 8px) 14px 20px;
  border-radius:0 0 30px 30px;overflow-y:auto;background:var(--nav-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  transform:translateY(-24px);transition:transform .3s var(--ease);}
.panel.open .panel-sheet{transform:translateY(0);}
.panel-title{font-size:13px;color:var(--text2);font-weight:600;padding:8px 4px;}
.cc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.cc-tile{background:var(--card);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:var(--sh);transition:transform .16s var(--ease);}
.cc-tile:active{transform:scale(.96);}
.cc-tile.on{background:var(--tint);color:#fff;}
.cc-tile .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:16px;color:var(--text);}
.cc-tile.on .ico{background:rgba(255,255,255,.25);color:#fff;}
.slider-wrap{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);}
.slider-wrap .lbl{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tint) 0%,var(--tint) var(--p,50%),var(--card2) var(--p,50%));outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.notif-card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;transition:transform .18s var(--ease);}
.notif-card:active{transform:scale(.98);}
.notif-card .nt{font-size:13.5px;font-weight:600;}
.notif-card .nb{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4;}
#multitask{position:absolute;inset:0;z-index:62;pointer-events:none;opacity:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .26s;
  display:flex;flex-direction:column;justify-content:center;gap:12px;padding:60px 20px 40px;}
#multitask.open{pointer-events:auto;opacity:1;}
.mt-card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:12px;transition:transform .2s var(--ease);}
.mt-card:active{transform:scale(.97);}
.mt-empty{color:#fff;text-align:center;font-size:14px;opacity:.8;}
/* 弹窗 */
#overlays{position:absolute;inset:0;z-index:80;pointer-events:none;}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px;pointer-events:auto;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s;}
.modal-wrap.show .modal-backdrop{opacity:1;}
.modal{position:relative;width:100%;max-width:310px;background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh-lg);
  transform:scale(.92);opacity:0;transition:transform .22s var(--ease),opacity .22s;max-height:80%;overflow-y:auto;}
.modal-wrap.show .modal{transform:scale(1);opacity:1;}
.m-title{font-size:16px;font-weight:600;margin:0 0 8px;}
.m-text{font-size:13.5px;color:var(--text2);margin:0 0 16px;line-height:1.5;}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.sheet-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
.sheet-item{background:var(--card);padding:14px;font-size:15px;text-align:left;transition:background .16s;}
.sheet-item:active{background:var(--card2);}
.sheet-item.cancel{background:var(--card);color:var(--tint);font-weight:600;text-align:center;border-radius:14px;margin-top:8px;}
#toasts{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 24px;}
.toast{background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;
  transform:translateY(10px) scale(.94);opacity:0;transition:all .26s var(--ease);max-width:100%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.toast.show{transform:translateY(0) scale(1);opacity:1;}
#home-indicator{position:absolute;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.36;z-index:41;}
#home-indicator:active{opacity:.7;}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none;}
@keyframes rip{to{transform:scale(2.6);opacity:0;}}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;}
.photo-cell{aspect-ratio:1;border-radius:6px;overflow:hidden;position:relative;transition:transform .16s;}
.photo-cell:active{transform:scale(.96);}
.photo-cell .fill{position:absolute;inset:0;background:linear-gradient(135deg,hsl(var(--h) 70% 62%),hsl(calc(var(--h) + 42) 70% 50%));}
.viewfinder{position:relative;aspect-ratio:3/4;margin:0 16px;border-radius:20px;overflow:hidden;display:grid;place-items:center;}
.viewfinder .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);background-size:33.33% 33.33%;}
.shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);margin:22px auto 0;display:block;transition:transform .14s var(--ease);}
.shutter:active{transform:scale(.9);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px;}
.mday{aspect-ratio:1;display:grid;place-items:center;font-size:13.5px;border-radius:10px;position:relative;transition:background .16s;}
.mday:active{background:var(--card2);}
.mday.head{color:var(--text2);font-size:11.5px;font-weight:600;}
.mday.dim{color:var(--text3);}
.mday.today{background:var(--tint);color:#fff;font-weight:600;}
.mday.has::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--orange);}
.mday.today.has::after{background:#fff;}
.progressbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;position:relative;}
.progressbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--tint);border-radius:3px;transition:width .25s linear;}
.hidden{display:none !important;}
.hra-hero{margin:12px 16px;padding:18px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,#1a1a24,#3a1414);box-shadow:0 10px 26px rgba(0,0,0,.35);position:relative;overflow:hidden;}
.hra-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);}
.hra-hero::before{content:"";position:absolute;right:-10px;top:-10px;width:90px;height:90px;border-radius:50%;border:1px solid rgba(255,255,255,.1);}
.hra-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:1px;opacity:.75;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
</style>

        id: "f1", boardId: "b0", title: "【求助】我家楼道多了一层，在线等，挺急的", author: "晚班回家的人", ts: NOW - 3 * HR,
        content: "先说明我不是来编故事的。\n\n我住青年路那边的老小区，六层，没电梯。昨晚加班回来，大概十一点半，爬到六楼，抬头一看——上面还有一层楼梯，往上是七楼。\n\n我当时以为走错了，退下去重新数，一、二、三、四、五、六，抬头还是能看到第七层的平台。灯是声控的，我跺了一下脚，灯亮了，那层楼梯就没了。\n\n我拍了视频，但录出来是全黑的，只有我自己的喘气声。\n\n有没有人知道这是什么情况？我今天不敢上楼了。",

        id: "f2", boardId: "b0", title: "【经验】渠京地铁 7 号线末班车注意事项（不是段子）", author: "末班车常客", ts: NOW - 9 * HR,
        content: "不是吓人，是真的提醒。\n\n7 号线末班是 23:47，从城南往北。如果你坐的是最后一节车厢，注意听广播。\n\n正常情况下，每站都会报站。但如果某一站广播没响，车却停了——不要下车。哪怕门开了，也别下。\n\n等广播重新响起来，再走。\n\n我遇到过一次。那天车厢里就我一个人。门开着，外面站台特别亮，亮得不像话。我站起来又坐回去了。后来广播响了一声「下一站，河堤路」，车就开了。\n\n我到现在都不知道那一站是什么站。",

        content: "我奶奶是渠京本地人，小时候跟我说过一句话：「别往井里看，井里有东西。」\n\n我一直以为是吓小孩的老话。\n\n但是我最近查了一下，90 年代渠京有十几口井被统一填埋了，档案上写的都是「市政改造」，没有具体说明。\n\n更奇怪的是，我搜「渠京 深井」的时候，能搜到的内容会在几秒后变成空白页。\n\n有没有老人知道这段的？",

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object" && over && typeof over === "object") {
    const out = {};
    Object.keys(base).forEach(k => { out[k] = Object.prototype.hasOwnProperty.call(over, k) ? deepMerge(base[k], over[k]) : base[k]; });
    Object.keys(over).forEach(k => { if (!Object.prototype.hasOwnProperty.call(base, k)) out[k] = over[k]; });
    return out;
  }
  return over === undefined ? base : over;
}
function migrate(d) {
  if (!d.settings) d.settings = clone(DEFAULT_DATA.settings);
  if (!d.hra) d.hra = clone(DEFAULT_DATA.hra);
  if (!d.story) d.story = clone(DEFAULT_DATA.story);
  d.v = DATA_VERSION;
  return d;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return clone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return clone(DEFAULT_DATA);
    return migrate(deepMerge(clone(DEFAULT_DATA), parsed));
  } catch (e) { console.warn("数据读取失败", e); return clone(DEFAULT_DATA); }
}

}

function haptic(ms = 8) { if (D.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
let audioCtx = null;
function beep(freq = 660, dur = 0.05, vol = 0.035) {
  if (!D.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function toast(msg, ms = 1900) {
  const box = $("#toasts");
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  box.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, ms);
}
function closeModal() {
  const w = $("#modal-wrap");
  if (!w) return;
  w.classList.remove("show");
  setTimeout(() => w.remove(), 220);
}
function modal(innerHTML) {
  closeModal();
  const wrap = document.createElement("div");
  wrap.className = "modal-wrap"; wrap.id = "modal-wrap";
  wrap.innerHTML = `<div class="modal-backdrop" data-action="closeModal"></div><div class="modal">${innerHTML}</div>`;
  $("#overlays").appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add("show"));
  return wrap;
}

function sheet(items) {

    <button class="sheet-item cancel" data-action="closeModal">取消</button>`);

    });

}
function ripple(el, e) {
  if (reducedMotion()) return;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const d = Math.max(r.width, r.height);
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = d + "px";
  span.style.left = (e.clientX - r.left - d / 2) + "px";
  span.style.top = (e.clientY - r.top - d / 2) + "px";
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  el.appendChild(span);
  setTimeout(() => span.remove(), 620);
}

const ACTIONS = {};
let lpFired = false;

document.addEventListener("click", e => {
  if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  ripple(el, e);
  haptic(8);
  try { fn(el, e); } catch (err) { console.error(err); toast("操作失败：" + err.message); }
}, true);

let lpTimer = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-longpress]");
  if (!el) return;
  lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpFired = true; haptic(18);
    const fn = ACTIONS[el.dataset.longpress];
    if (fn) { try { fn(el, e); } catch (err) { console.error(err); } }
  }, 460);
}, true);
["pointerup", "pointercancel", "pointermove", "scroll"].forEach(ev =>
  document.addEventListener(ev, () => { clearTimeout(lpTimer); }, true));

/* ================= 路由 ================= */
const Router = {
  stack: [],
  push(key, renderFn) {
    const el = document.createElement("div");
    el.className = "page";
    const rec = { key, render: renderFn, el };
    const prev = this.top();
    $("#pages-layer").appendChild(el);
    this.stack.push(rec);
    this.paint(rec);
    void el.offsetWidth;
    requestAnimationFrame(() => {
      el.classList.add("in");
      if (prev) { prev.el.classList.add("behind"); prev.el.style.pointerEvents = "none"; }
    });
    return rec;
  },
  top() { return this.stack[this.stack.length - 1]; },
  paint(rec) {
    rec.el.innerHTML = rec.render();
    const scroller = rec.el.querySelector(".chat-scroll");
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  },
  refresh() { const rec = this.top(); if (rec) this.paint(rec); },
  pop() {
    const rec = this.stack.pop();
    if (!rec) return false;
    rec.el.classList.remove("in"); rec.el.classList.add("out");
    const prev = this.top();
    if (prev) { prev.el.classList.remove("behind"); prev.el.style.pointerEvents = ""; }
    setTimeout(() => rec.el.remove(), 320);
    return true;
  },
  home() {
    this.stack.forEach(r => r.el.remove());
    this.stack = [];
  }
};

function simulateCall(who) {
  modal(`<div style="text-align:center;padding:8px 0">
    <div class="avatar lg" style="margin:0 auto 14px;--h:200">${esc(String(who).slice(0,1))}</div>
    <div style="font-size:18px;font-weight:600">${esc(who)}</div>
    <div style="font-size:13px;color:var(--text2);margin-top:6px" id="call-status">正在呼叫…</div>
  </div>`);
  let sec = 0, connected = false;
  const st = $("#call-status");
  const t = setInterval(() => {
    if (!connected && sec >= 2) { connected = true; st.textContent = "通话中 00:00"; }
    else if (connected) { sec += 1; st.textContent = "通话中 " + pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
    else sec += 1;
  }, 1000);
  const btn = document.createElement("button");
  btn.className = "btn danger wide"; btn.textContent = "挂断";
  btn.onclick = () => { clearInterval(t); closeModal(); toast("通话已结束"); };
  $("#modal-wrap").querySelector(".modal").appendChild(btn);
}

/* ================= 时钟 ================= */
function fmtMs(ms) {
  ms = Math.max(0, ms);
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), c = Math.floor((ms%1000)/10);
  return pad(m) + ":" + pad(s) + "." + pad(c);
}
function appClock() {
  const sw = S.stopwatch;
  const elapsed = sw.running ? sw.elapsed + (Date.now() - sw.start) : sw.elapsed;
  const tmr = S.timer;
  return nav("时钟") + body(`
    <div class="section-title">世界时钟</div>
    <div class="list">
      ${[["渠京",0],["东京",1],["伦敦",-8],["纽约",-13]].map(([n,off]) => {
        const d = new Date(Date.now() + off*HR);
        return `<div class="list-item"><div class="li-main"><div class="li-title">${n}</div>
        <div class="li-sub">${off===0?"本地时间":(off>0?"+"+off:off)+" 小时"}</div></div>
        <div style="font-size:22px;font-weight:300">${pad(d.getHours())}:${pad(d.getMinutes())}</div></div>`;
      }).join("")}
    </div>
    <div class="section-title">秒表</div>
    <div class="list" style="padding:18px;text-align:center">
      <div style="font-size:38px;font-weight:250;font-variant-numeric:tabular-nums" id="sw-display">${fmtMs(elapsed)}</div>
      <div class="row" style="justify-content:center;gap:12px;margin-top:14px">
        <button class="btn ${sw.running ? "danger" : "primary"}" data-action="swToggle">${sw.running ? "暂停" : "开始"}</button>
        <button class="btn ghost" data-action="swReset">重置</button>
      </div>

  else {
    sw.start = Date.now(); sw.running = true;
    sw.timer = setInterval(() => {
      const d = document.getElementById("sw-display");
      if (d) d.textContent = fmtMs(sw.elapsed + Date.now() - sw.start);
    }, 50);
  }

};

ACTIONS.timerSet = el => { S.timer.remain = Number(el.dataset.min) * 60000; Router.refresh(); };
ACTIONS.timerToggle = () => {
  const t = S.timer;
  if (t.running) { clearInterval(t.timer); t.running = false; }
  else {
    if (t.remain <= 0) t.remain = 60000;
    t.running = true;
    const end = Date.now() + t.remain;
    t.timer = setInterval(() => {
      t.remain = end - Date.now();
      const d = document.getElementById("timer-display");
      if (d) d.textContent = fmtMs(t.remain);
      if (t.remain <= 0) {
        clearInterval(t.timer); t.running = false; t.remain = 0;
        toast("⏰ 计时结束"); beep(880, 0.15, 0.08); Router.refresh();
      }
    }, 100);
  }

};

function appCalendar() {
  const cur = S.calMonth, y = cur.getFullYear(), m = cur.getMonth();
  const startDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const todayStr = isoDate(new Date());
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push({ d: prevDays - startDow + i + 1, dim: true });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ d: i, dim: false });
  while (cells.length % 7 !== 0) cells.push({ d: cells.length - startDow - daysInMonth + 1, dim: true });
  const dayEvents = D.events.filter(e => e.date === S.calSelected);
  return nav("日历", { right: `<button class="nav-btn" data-action="addEvent" aria-label="添加事件">${ic("plus")}</button>` }) +
    body(`
    <div class="row" style="padding:0 16px 10px">

      <div style="flex:1;text-align:center;font-size:16px;font-weight:600">${y} 年 ${m+1} 月</div>
      <button class="btn ghost sm" data-action="calNext">›</button>
    </div>
    <div class="month-grid">
      ${["日","一","二","三","四","五","六"].map(d => `<div class="mday head">${d}</div>`).join("")}
      ${cells.map(c => {
        const ds = `${y}-${pad(m+1)}-${pad(c.d)}`;
        const isToday = !c.dim && ds === todayStr;
        const has = D.events.some(e => e.date === ds);
        return `<div class="mday ${c.dim?"dim":""} ${isToday?"today":""} ${has?"has":""}" data-action="calPick" data-date="${ds}">${c.d}</div>`;
      }).join("")}
    </div>
    <div class="section-title">${esc(S.calSelected)} 的日程</div>
    <div class="list">
      ${dayEvents.length ? dayEvents.map(e => `<div class="list-item">
        <div class="li-main"><div class="li-title">${esc(e.title)}</div><div class="li-sub">${esc(e.time || "全天")}</div></div>

      </div>`).join("") : `<div class="empty" style="padding:26px">这一天还没有安排</div>`}
    </div>
  `);
}

function appCalculator() {
  const keys = [["AC","fn"],["⌫","fn"],["%","fn"],["÷","op"],["7",""],["8",""],["9",""],["×","op"],
    ["4",""],["5",""],["6",""],["−","op"],["1",""],["2",""],["3",""],["+","op"],["0","","span2"],[".",""],["=","op"]];
  return nav("计算器") + body(`
    <div class="calc-display">${esc(S.calcDisplay)}</div>
    <div class="calc-pad">
      ${keys.map(k => `<button class="calc-key ${k[1]}" style="${k[2]==="span2"?"grid-column:span 2":""}" data-action="calcKey" data-k="${esc(k[0])}">${esc(k[0])}</button>`).join("")}
    </div>
  `);
}
ACTIONS.calcKey = el => {
  const k = el.dataset.k;
  if (k === "AC") { S.calcExpr = ""; S.calcDisplay = "0"; Router.refresh(); return; }
  if (k === "⌫") { S.calcExpr = S.calcExpr.slice(0, -1); S.calcDisplay = S.calcExpr || "0"; Router.refresh(); return; }
  if (k === "=") {
    try { const r = evalExpr(S.calcExpr); S.calcDisplay = String(r); S.calcExpr = String(r); }
    catch (e) { S.calcDisplay = "错误"; S.calcExpr = ""; }
    Router.refresh(); return;
  }
  const map = { "÷": "/", "×": "*", "−": "-" };
  S.calcExpr += map[k] || k;
  S.calcDisplay = S.calcExpr;
  Router.refresh();
};
function evalExpr(expr) {
  if (!expr) return 0;
  const clean = expr.replace(/%/g, "/100");
  if (!/^[0-9+\-*/().\s]+$/.test(clean)) throw new Error("表达式非法");
  const v = Function('"use strict";return (' + clean + ")")();
  if (typeof v !== "number" || !isFinite(v)) throw new Error("结果非法");
  return Math.round(v * 1e10) / 1e10;
}

ACTIONS.gameStart = () => {
  if (S.game.running) return;
  S.game.running = true; S.game.score = 0;
  const area = $("#game-area");
  const startBtn = $("#game-start");
  if (startBtn) startBtn.remove();
  const scoreEl = $("#game-score");
  let timeLeft = 20;
  const timerEl = document.createElement("div");
  timerEl.style.cssText = "position:absolute;top:8px;left:12px;font-size:12px;color:var(--text2)";
  timerEl.textContent = "剩余 20s";
  area.appendChild(timerEl);
  const spawn = () => {
    if (!S.game.running) return;
    const b = document.createElement("button");
    const size = 34 + Math.random() * 22;
    b.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;
      background:radial-gradient(circle at 30% 30%,#7ad6ff,#0a84ff);
      left:${Math.random() * (area.clientWidth - size)}px;top:${Math.random() * (area.clientHeight - size)}px;`;
    b.onclick = ev => {
      ev.stopPropagation();
      if (!S.game.running) return;
      S.game.score++;
      if (scoreEl) scoreEl.textContent = S.game.score;
      beep(880, 0.04); b.remove(); spawn();
    };
    area.appendChild(b);
    setTimeout(() => b.remove(), 900);
  };
  spawn();
  const iv = setInterval(spawn, 520);
  const cd = setInterval(() => {
    timeLeft--;
    timerEl.textContent = "剩余 " + timeLeft + "s";
    if (timeLeft <= 0) {
      clearInterval(iv); clearInterval(cd);
      S.game.running = false;
      S.game.best = Math.max(S.game.best, S.game.score);
      area.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--text2)">

      area.onclick = () => { area.onclick = null; Router.refresh(); };
      toast("游戏结束，得分 " + S.game.score);
    }
  }, 1000);
};

  D.hra.sign.push(today);

    const s = isoDate(d);

  D.hra.streak = streak;
  D.hra.points += 5;
  save(); renderHome(); Router.refresh();
  beep(760, 0.08);

/* ================= 剧情引擎 ================= */
const Story = {
  trigger(evt) {
    try {
      const st = D.story;
      if (!st || !st.enabled || !st.story || !Array.isArray(st.story.nodes)) return;
      st.story.nodes.forEach(node => {
        if (!node || !node.on) return;
        if (node.once && st.done.includes(node.id)) return;
        if (!this.match(node.on, evt)) return;
        st.done.push(node.id);
        st.log.push({ id: node.id, ts: Date.now() });
        this.run(node.actions || []);
        save();
      });
    } catch (e) { console.warn("剧情执行出错", e); }
  },
  match(cond, evt) {
    if (!cond || cond.type !== evt.type) return false;
    if (cond.type === "appOpen") return !cond.app || cond.app === evt.app;
    return true;
  },
  run(actions) {
    (actions || []).forEach(act => {
      try {
        if (act.type === "notify") {
          D.notifications.unshift({ id: uid(), app: act.app || "system", title: act.title || "系统", body: act.body || "", ts: Date.now() });
          renderLockNotifs();
          toast(act.title ? act.title + "：" + (act.body || "") : act.body || "新通知");
        } else if (act.type === "addMessage") {
          const c = D.chats.find(x => x.id === act.chatId) || D.chats[0];
          if (c) { c.msgs.push({ id: uid(), from: act.from || "them", type: "text", text: act.text || "", ts: Date.now() }); c.unread = (c.unread || 0) + 1; }
        } else if (act.type === "setVar") { D.story.vars[act.key] = act.value; }
        else if (act.type === "openApp") setTimeout(() => openApp(act.app), 300);
        else if (act.type === "delay") setTimeout(() => this.run(act.actions || []), act.ms || 1000);
        else if (act.type === "choice") setTimeout(() => sheet((act.options || []).map(o => ({ label: o.text, fn: () => this.run(o.actions || []) }))), 260);
      } catch (e) { console.warn("剧情动作出错", e); }
    });
  }
};

/* ================= 系统层 ================= */
function applyTheme() { document.documentElement.setAttribute("data-theme", D.settings.theme === "dark" ? "dark" : "light"); }
function applyFontSize() { const scr = $("#screen"); if (scr) scr.style.fontSize = D.settings.fontSize + "px"; }
function applyWallpaper() { const wp = $("#wallpaper"); if (wp) wp.style.background = WALLPAPERS[D.settings.wallpaper] || WALLPAPERS[0]; }

function renderHome() {
  const pages = homePages();
  $("#dpages").innerHTML = pages.map((list, idx) => `
    <div class="dpage">
      ${idx === 0 ? `
        <div class="widget">
          <div><div class="w-time" id="w-time">09:41</div><div class="w-date" id="w-date">1月1日 周一</div></div>
          <div><div class="w-temp">26°</div><div class="w-city">晴 · 渠京市</div></div>
        </div>` : ""}
      <div class="icon-grid">${list.map(appIconHTML).join("")}</div>
    </div>`).join("");
  $("#dots").innerHTML = pages.map((_, i) => `<span class="dot-ind ${i === S.page ? "on" : ""}"></span>`).join("");
  $("#dock").innerHTML = DOCK.map(appIconHTML).join("");
  if (S.page >= pages.length) S.page = pages.length - 1;
  updatePageTransform();
  tickClock();
}
function updatePageTransform() {
  const dp = $("#dpages");
  if (!dp) return;
  const w = $("#screen").clientWidth || 390;
  dp.style.transform = `translateX(${-S.page * w}px)`;
}
function tickClock() {
  const d = new Date();
  const t = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const dateStr = `${d.getMonth() + 1}月${d.getDate()}日 星期${"日一二三四五六"[d.getDay()]}`;
  const sbt = $("#sb-time"); if (sbt) sbt.textContent = t;
  const wt = $("#w-time"); if (wt) wt.textContent = t;
  const lt = $("#lock-time"); if (lt) lt.textContent = t;
  const ld = $("#lock-date"); if (ld) ld.textContent = dateStr;
  const wd = $("#w-date"); if (wd) wd.textContent = dateStr;
}

/* ================= 锁屏 ================= */
function renderLockNotifs() {
  const box = $("#lock-notifs");
  if (!box) return;
  box.innerHTML = D.notifications.slice(0, 3).map(n => `
    <div class="lock-notif"><span class="dot"></span>
      <div><strong>${esc(n.title)}</strong><div style="opacity:.9;margin-top:2px">${esc(n.body)}</div></div>
    </div>`).join("");
}
let pwInput = "";
function renderKeypad() {
  const pad = $("#pw-pad");
  if (!pad) return;
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  pad.innerHTML = keys.map(k => k === "" ? `<div class="pw-key blank"></div>`
    : `<button class="pw-key" data-action="pwKey" data-k="${k}">${k}</button>`).join("");
  $("#pw-dots").innerHTML = Array.from({ length: 4 }, (_, i) => `<span class="pw-dot ${i < pwInput.length ? "on" : ""}"></span>`).join("");
}
ACTIONS.pwKey = el => {
  const k = el.dataset.k;
  if (k === "⌫") { pwInput = pwInput.slice(0, -1); renderKeypad(); return; }
  if (pwInput.length >= 4) return;
  pwInput += k;
  renderKeypad();
  if (pwInput.length === 4) {
    setTimeout(() => {
      if (pwInput === D.settings.passcode) {
        pwInput = "";
        $("#lock-keypad").classList.remove("show");
        unlock();
      } else {
        toast("密码错误，请重试"); pwInput = ""; renderKeypad();
      }
    }, 160);
  }
};
ACTIONS.hideKeypad = () => { $("#lock-keypad").classList.remove("show"); pwInput = ""; };
function tryUnlock() {
  if (D.settings.passcodeOn) { pwInput = ""; renderKeypad(); $("#lock-keypad").classList.add("show"); }
  else unlock();
}
function unlock() {
  S.locked = false;
  const ls = $("#lock-screen");
  ls.classList.add("hide");
  setTimeout(() => ls.classList.add("hidden"), 460);
  $("#home").classList.remove("hide");
  Story.trigger({ type: "unlock" });
}

  mt.classList.add("open"); S.multitask = true;
}
function closeMultitask() { $("#multitask").classList.remove("open"); S.multitask = false; }
ACTIONS.multitask = () => openMultitask();
ACTIONS.mtResume = el => {
  const idx = Number(el.dataset.idx);
  while (Router.stack.length > idx + 1) { const r = Router.stack.pop(); r.el.remove(); }
  closeMultitask();
};
ACTIONS.mtClose = el => {
  const idx = Number(el.dataset.idx);
  const rec = Router.stack[idx];
  if (rec) {
    rec.el.remove(); Router.stack.splice(idx, 1);
    const top = Router.top();
    if (top) { top.el.classList.remove("behind"); top.el.style.pointerEvents = ""; top.el.classList.add("in"); }
  }
  openMultitask();
};

/* ================= 手势 ================= */
let gp = null;
const screenEl = () => $("#screen");
screenEl().addEventListener("pointerdown", e => {
  if (e.target.closest(".modal-wrap, input, textarea, [contenteditable]")) { gp = null; return; }
  const r = screenEl().getBoundingClientRect();
  gp = { x0: e.clientX - r.left, y0: e.clientY - r.top, W: r.width, H: r.height };
}, true);
screenEl().addEventListener("pointerup", e => {
  if (!gp) return;
  const r = screenEl().getBoundingClientRect();
  handleGesture(e.clientX - r.left - gp.x0, e.clientY - r.top - gp.y0, gp);
  gp = null;
}, true);
function handleGesture(dx, dy, g) {
  if (Math.abs(dy) < 12 && Math.abs(dx) < 12) return;
  if (g.y0 < 30 && dy > 46 && Math.abs(dy) > Math.abs(dx)) {
    if (g.x0 > g.W * 0.55) openCC(); else openNC();
    return;
  }
  if (g.x0 < 26 && dx > 62 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (S.notifOpen || S.ccOpen) { closeNC(); closeCC(); return; }
    if (Router.stack.length) { Router.pop(); return; }
  }
  if (g.y0 > g.H - 34 && dy < -46 && Math.abs(dy) > Math.abs(dx)) {
    if (Router.stack.length) Router.home();
  }
}
(function bindPageSwipe() {
  const dp = $("#dpages");
  let dragging = false, startX = 0, startY = 0, dx = 0, w = 390;
  dp.addEventListener("pointerdown", e => {
    if (S.locked) return;
    if (e.target.closest("input,textarea")) return;
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0;
    w = screenEl().clientWidth || 390;
    dp.classList.add("dragging");
    try { dp.setPointerCapture(e.pointerId); } catch (err) {}
  });
  dp.addEventListener("pointermove", e => {
    if (!dragging) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) { dragging = false; dp.classList.remove("dragging"); return; }
    const pages = homePages();
    let base = -S.page * w, offset = dx;
    if ((S.page === 0 && dx > 0) || (S.page === pages.length - 1 && dx < 0)) offset = dx * 0.32;
    dp.style.transform = `translateX(${base + offset}px)`;
  });
  const end = () => {
    if (!dragging) { dp.classList.remove("dragging"); return; }
    dragging = false; dp.classList.remove("dragging");
    const pages = homePages();
    if (dx < -60 && S.page < pages.length - 1) S.page++;
    else if (dx > 60 && S.page > 0) S.page--;
    updatePageTransform();
    $$("#dots .dot-ind").forEach((d, i) => d.classList.toggle("on", i === S.page));
  };
  dp.addEventListener("pointerup", end);
  dp.addEventListener("pointercancel", end);
})();
(function bindLock() {
  const ls = $("#lock-screen");
  let y0 = null;
  ls.addEventListener("pointerdown", e => { if (e.target.closest("#lock-keypad")) return; y0 = e.clientY; });
  ls.addEventListener("pointerup", e => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    if (dy < -36) tryUnlock();
    y0 = null;
  });
  ls.addEventListener("click", e => { if (e.target.closest("button")) return; tryUnlock(); });
})();

/* ================= 启动 ================= */
function fitPhone() {
  const p = $("#phone");
  if (!p) return;
  if (window.innerWidth <= 520) { p.style.transform = ""; return; }
  const s = Math.min(1, (window.innerHeight - 40) / 844, (window.innerWidth - 40) / 390);
  p.style.transform = `scale(${s})`;
}
function boot() {
  applyTheme(); applyFontSize(); applyWallpaper();
  renderHome(); renderLockNotifs(); tickClock();
  setInterval(tickClock, 1000);
  fitPhone();
  window.addEventListener("resize", () => { fitPhone(); updatePageTransform(); });
  $("#screen").style.filter = `brightness(${0.55 + D.settings.brightness/100*0.45})`;
  if (D.settings.passcodeOn) setTimeout(() => toast("提示：默认锁屏密码为 1234", 2600), 900);
  window.addEventListener("error", e => console.error(e.error || e.message));
  window.addEventListener("unhandledrejection", e => console.error("Promise 错误", e.reason));
}
boot();
</script>
