<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>星屿 OS</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --fs:15px;
  --status-h:44px;
  --bg:#f2f2f7; --bg2:#ffffff;
  --text:#0b0b0f; --text2:#8a8a8e; --text3:#b6b6bd;
  --line:rgba(60,60,67,.12);
  --card:#ffffff; --card2:#f4f4f7;
  --nav-bg:rgba(247,247,250,.92);
  --tint:#0a84ff; --tint-soft:rgba(10,132,255,.12);
  --green:#34c759; --red:#ff3b30; --orange:#ff9500; --purple:#af52de;
  --r-sm:10px; --r:16px; --r-lg:24px;
  --sh:0 4px 16px rgba(0,0,0,.08);
  --sh-lg:0 18px 50px rgba(0,0,0,.28);
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:280ms;
}
[data-theme="dark"]{
  --bg:#000; --bg2:#1c1c1e; --text:#fff; --text2:#8e8e93; --text3:#5a5a5f;
  --line:rgba(255,255,255,.13); --card:#1c1c1e; --card2:#2c2c2e;
  --nav-bg:rgba(28,28,30,.9); --tint:#0a84ff; --tint-soft:rgba(10,132,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#0b0b12;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 18%,#26263a 0%,#0b0b12 68%);}
#phone{position:relative;width:390px;height:844px;border-radius:46px;background:#000;
  box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 0 10px #1a1a1e,0 0 0 12px #303036;
  overflow:hidden;transform-origin:center center;flex:0 0 auto;}
@media (max-width:520px),(max-height:700px){
  #phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
  #stage{background:#000;}
}
#screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;touch-action:pan-y;}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;}
svg.ic{width:1em;height:1em;fill:currentColor;display:block;flex:0 0 auto;}

/* ============ 壁纸 ============ */
#wallpaper{position:absolute;inset:0;z-index:0;transition:background .5s var(--ease);
  background:linear-gradient(160deg,#5b8def 0%,#8f6ef0 45%,#f0a6ca 100%);}
#wallpaper::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),transparent 45%),
             radial-gradient(circle at 80% 80%,rgba(255,255,255,.18),transparent 50%);}

/* ============ 状态栏 ============ */
#statusbar{position:absolute;top:0;left:0;right:0;z-index:40;
  height:calc(var(--status-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 22px 0;
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:600;pointer-events:none;
  color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,.06);}
.sb-right{display:flex;align-items:center;gap:5px;font-size:13px;}
.sb-right .ic{font-size:14px;}
.batt{display:flex;align-items:center;gap:3px;}
.batt-box{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9;}
.batt-box::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0;}
.batt-fill{position:absolute;inset:1.4px;width:78%;background:currentColor;border-radius:1.5px;}

/* ============ 锁屏 ============ */
#lock-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  padding:calc(var(--status-h) + env(safe-area-inset-top) + 26px) 24px 30px;
  color:#fff;transition:transform .45s var(--ease),opacity .35s;
  text-shadow:0 2px 14px rgba(0,0,0,.35);}
#lock-screen.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
.lock-time{font-size:74px;font-weight:250;letter-spacing:-3px;line-height:1;}
.lock-date{font-size:16px;opacity:.92;margin-top:8px;font-weight:500;}
.lock-notifs{margin-top:auto;display:flex;flex-direction:column;gap:9px;}
.lock-notif{background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:16px;padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.lock-notif .dot{width:8px;height:8px;border-radius:50%;background:#fff;margin-top:6px;flex:0 0 auto;opacity:.9;}
.lock-hint{text-align:center;font-size:13px;opacity:.8;margin-top:18px;animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#lock-keypad{position:absolute;inset:0;z-index:22;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;color:#fff;
  background:rgba(0,0,0,.34);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
#lock-keypad.show{display:flex;}
.pw-dots{display:flex;gap:14px;margin-bottom:6px;}
.pw-dot{width:12px;height:12px;border-radius:50%;border:1.6px solid #fff;transition:background .18s;}
.pw-dot.on{background:#fff;}
.pw-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
.pw-key{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);
  color:#fff;font-size:26px;font-weight:400;display:grid;place-items:center;transition:transform .12s,background .12s;}
.pw-key:active{transform:scale(.92);background:rgba(255,255,255,.36);}
.pw-key.blank{background:transparent;pointer-events:none;}

/* ============ 桌面 ============ */
#home{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding-top:calc(var(--status-h) + env(safe-area-inset-top));
  opacity:1;transition:opacity .3s,transform .35s var(--ease);}
#home.hide{opacity:0;pointer-events:none;transform:scale(.96);}
#dpages{flex:1;display:flex;will-change:transform;transition:transform .34s var(--ease);}
#dpages.dragging{transition:none;}
.dpage{flex:0 0 100%;width:100%;padding:6px 16px 4px;overflow-y:auto;overflow-x:hidden;}
.widget{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.24);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;padding:16px 18px;color:#fff;margin:4px 2px 18px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);text-shadow:0 1px 8px rgba(0,0,0,.2);}
.w-time{font-size:38px;font-weight:300;letter-spacing:-1.5px;line-height:1;}
.w-date{font-size:12px;opacity:.9;margin-top:5px;}
.w-right{text-align:right;}
.w-temp{font-size:30px;font-weight:300;line-height:1;}
.w-city{font-size:12px;opacity:.9;margin-top:5px;}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;
  color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.45);
  transition:transform .16s var(--ease);}
.app-icon:active{transform:scale(.9);}
.app-icon .glyph{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;
  font-size:28px;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;}
.app-icon .glyph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);}
.app-icon .label{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;
  padding:0 5px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.3);}
#dots{display:flex;justify-content:center;gap:7px;padding:8px 0 4px;}
.dot-ind{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.42);transition:background .25s;}
.dot-ind.on{background:#fff;}
#dock{margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:10px 8px;
  border-radius:30px;display:flex;justify-content:space-around;
  background:rgba(255,255,255,.22);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 8px 26px rgba(0,0,0,.16);}
#dock .app-icon .label{display:none;}

/* ============ 页面 / 路由 ============ */
#pages-layer{position:absolute;inset:0;z-index:5;pointer-events:none;}
.page{position:absolute;inset:0;pointer-events:auto;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:calc(var(--status-h) + env(safe-area-inset-top));
  transform:translateX(100%);transition:transform var(--dur) var(--ease),opacity var(--dur);}
.page.in{transform:translateX(0);}
.page.out{transform:translateX(100%);}
.page.behind{transform:translateX(-24%);opacity:.75;}
.nav{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;min-height:46px;
  position:relative;background:var(--bg);z-index:2;}
.nav-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;
  font-size:20px;color:var(--tint);flex:0 0 auto;transition:background .18s;}
.nav-btn:active{background:var(--tint-soft);}
.nav-title{flex:1;font-size:17px;font-weight:600;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.nav-right{min-width:36px;display:flex;justify-content:flex-end;}
.page-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:26px;}
.page-body::-webkit-scrollbar{width:0;}

/* 通用组件 */
.pad{padding:0 16px;}
.section-title{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.4px;
  padding:18px 16px 8px;text-transform:uppercase;}
.list{background:var(--card);border-radius:var(--r);margin:0 16px;overflow:hidden;}
.list.flat{margin:0;border-radius:0;background:transparent;}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;
  border-bottom:1px solid var(--line);position:relative;transition:background .16s;}
.list-item:last-child{border-bottom:0;}
.list-item:active{background:var(--card2);}
.li-main{flex:1;min-width:0;}
.li-title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-sub{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.li-time{font-size:11.5px;color:var(--text3);flex:0 0 auto;align-self:flex-start;margin-top:3px;}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;font-weight:600;font-size:17px;background:hsl(var(--h,200) 62% 55%);}
.avatar.sm{width:32px;height:32px;font-size:13px;}
.avatar.lg{width:64px;height:64px;font-size:24px;}
.btn{border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;
  background:var(--card2);color:var(--text);transition:transform .14s var(--ease),opacity .14s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;}
.btn:active{transform:scale(.96);opacity:.85;}
.btn.primary{background:var(--tint);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn.ghost{background:var(--card2);color:var(--tint);}
.btn.wide{width:100%;margin-top:14px;min-height:46px;}
.btn.sm{padding:6px 12px;min-height:32px;font-size:12.5px;border-radius:9px;}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:15px;outline:none;transition:border-color .18s;resize:vertical;}
.field:focus{border-color:var(--tint);}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:48px 24px;}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.5;}
.row{display:flex;gap:10px;align-items:center;}
.spacer{flex:1;}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--tint-soft);color:var(--tint);font-weight:600;}

/* 聊天气泡 */
.chat-scroll{flex:1;overflow-y:auto;padding:10px 14px 8px;-webkit-overflow-scrolling:touch;}
.bubble-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:8px;}
.bubble-row.me{flex-direction:row-reverse;}
.bubble{max-width:74%;padding:9px 13px;border-radius:17px;font-size:14.5px;word-break:break-word;
  background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative;line-height:1.42;}
.bubble-row.me .bubble{background:var(--tint);color:#fff;}
.bubble-row.them .bubble{border-bottom-left-radius:5px;}
.bubble-row.me .bubble{border-bottom-right-radius:5px;}
.bubble .meta{font-size:10.5px;opacity:.6;margin-top:4px;text-align:right;}
.bubble.img{width:150px;height:110px;padding:0;overflow:hidden;border-radius:14px;}
.chat-time{text-align:center;font-size:11px;color:var(--text3);margin:10px 0;}
.chat-inputbar{display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);}
.chat-input{flex:1;background:var(--card2);border-radius:19px;padding:10px 14px;font-size:15px;
  outline:none;border:1px solid transparent;min-height:40px;}
.chat-input:focus{border-color:var(--tint);}
.send-btn{background:var(--tint);color:#fff;border-radius:19px;padding:0 16px;height:40px;
  font-size:14px;font-weight:600;transition:transform .14s var(--ease);}
.send-btn:active{transform:scale(.94);}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--card2);font-size:19px;flex:0 0 auto;}
.round:active{transform:scale(.92);}

/* 计算器 */
.calc-display{padding:26px 22px 12px;text-align:right;font-size:46px;font-weight:250;
  letter-spacing:-1px;min-height:100px;word-break:break-all;line-height:1.1;}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 14px 20px;}
.calc-key{height:66px;border-radius:33px;background:var(--card);font-size:23px;font-weight:500;
  display:grid;place-items:center;transition:transform .12s var(--ease),background .12s;}
.calc-key:active{transform:scale(.94);background:var(--card2);}
.calc-key.op{background:var(--orange);color:#fff;}
.calc-key.fn{background:var(--card2);color:var(--tint);}

/* 论坛 */
.chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);font-size:13px;white-space:nowrap;
  border:1px solid var(--line);transition:all .18s;font-weight:500;}
.chip.on{background:var(--tint);color:#fff;border-color:var(--tint);}
.post-card{background:var(--card);border-radius:var(--r);margin:0 16px 10px;padding:14px;
  box-shadow:var(--sh);transition:transform .16s var(--ease);}
.post-card:active{transform:scale(.985);}
.post-title{font-size:15.5px;font-weight:600;line-height:1.35;margin-bottom:6px;}
.post-excerpt{font-size:13px;color:var(--text2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-foot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--text2);}
.act-btn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--text2);
  padding:4px 8px;border-radius:8px;transition:background .16s;}
.act-btn:active{background:var(--card2);}
.act-btn.on{color:var(--red);}
.act-btn .ic{font-size:14px;}
.comment{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
.comment .body{flex:1;min-width:0;}
.comment .name{font-size:12.5px;color:var(--text2);font-weight:600;}
.comment .txt{font-size:14px;margin-top:3px;word-break:break-word;line-height:1.45;}

/* 开关 */
.switch{width:50px;height:30px;border-radius:15px;background:var(--card2);position:relative;
  transition:background .22s;flex:0 0 auto;border:1px solid var(--line);}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s var(--ease);}
.switch.on{background:var(--green);border-color:var(--green);}
.switch.on::after{transform:translateX(20px);}

/* 面板 */
.panel{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .26s;}
.panel.open{pointer-events:auto;opacity:1;}
.panel-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.panel-sheet{position:absolute;left:0;right:0;top:0;max-height:88%;
  padding:calc(var(--status-h) + env(safe-area-inset-top) + 8px) 14px 20px;
  border-radius:0 0 30px 30px;overflow-y:auto;
  background:var(--nav-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  transform:translateY(-24px);transition:transform .3s var(--ease);}
.panel.open .panel-sheet{transform:translateY(0);}
.panel-title{font-size:13px;color:var(--text2);font-weight:600;padding:8px 4px;}

/* 控制中心 */
.cc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.cc-tile{background:var(--card);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:600;box-shadow:var(--sh);transition:transform .16s var(--ease);}
.cc-tile:active{transform:scale(.96);}
.cc-tile.on{background:var(--tint);color:#fff;}
.cc-tile .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--card2);font-size:16px;color:var(--text);}
.cc-tile.on .ico{background:rgba(255,255,255,.25);color:#fff;}
.slider-wrap{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);}
.slider-wrap .lbl{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--tint) 0%,var(--tint) var(--p,50%),var(--card2) var(--p,50%));outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;}

/* 通知中心 */
.notif-card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:9px;
  box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;transition:transform .18s var(--ease);}
.notif-card:active{transform:scale(.98);}
.notif-card .avatar{width:34px;height:34px;font-size:14px;}
.notif-card .nt{font-size:13.5px;font-weight:600;}
.notif-card .nb{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4;}

/* 多任务 */
#multitask{position:absolute;inset:0;z-index:62;pointer-events:none;opacity:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .26s;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:60px 20px 40px;}
#multitask.open{pointer-events:auto;opacity:1;}
.mt-card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh-lg);
  display:flex;align-items:center;gap:12px;transition:transform .2s var(--ease);}
.mt-card:active{transform:scale(.97);}
.mt-empty{color:#fff;text-align:center;font-size:14px;opacity:.8;}

/* 弹窗 & Toast */
#overlays{position:absolute;inset:0;z-index:80;pointer-events:none;}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:26px;pointer-events:auto;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s;}
.modal-wrap.show .modal-backdrop{opacity:1;}
.modal{position:relative;width:100%;max-width:310px;background:var(--card);border-radius:20px;
  padding:20px;box-shadow:var(--sh-lg);transform:scale(.92);opacity:0;
  transition:transform .22s var(--ease),opacity .22s;max-height:80%;overflow-y:auto;}
.modal-wrap.show .modal{transform:scale(1);opacity:1;}
.m-title{font-size:16px;font-weight:600;margin:0 0 8px;}
.m-text{font-size:13.5px;color:var(--text2);margin:0 0 16px;line-height:1.5;}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.sheet-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
.sheet-item{background:var(--card);padding:14px;font-size:15px;text-align:left;transition:background .16s;}
.sheet-item:active{background:var(--card2);}
.sheet-item.cancel{background:var(--card);color:var(--tint);font-weight:600;text-align:center;
  border-radius:14px;margin-top:8px;}
#toasts{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:120;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 24px;}
.toast{background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;
  transform:translateY(10px) scale(.94);opacity:0;transition:all .26s var(--ease);max-width:100%;
  text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.toast.show{transform:translateY(0) scale(1);opacity:1;}

/* Home 指示条 */
#home-indicator{position:absolute;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);
  opacity:.36;z-index:41;transition:opacity .2s;}
#home-indicator:active{opacity:.7;}

/* 涟漪 */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;
  transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none;}
@keyframes rip{to{transform:scale(2.6);opacity:0;}}

/* 各种小组件 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;}
.photo-cell{aspect-ratio:1;border-radius:6px;overflow:hidden;position:relative;transition:transform .16s;}
.photo-cell:active{transform:scale(.96);}
.photo-cell .fill{position:absolute;inset:0;background:linear-gradient(135deg,hsl(var(--h) 70% 62%),hsl(calc(var(--h) + 42) 70% 50%));}
.viewfinder{position:relative;aspect-ratio:3/4;margin:0 16px;border-radius:20px;overflow:hidden;
  background:linear-gradient(150deg,#2b5876,#4e4376);display:grid;place-items:center;}
.viewfinder .grid-lines{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
  background-size:33.33% 33.33%;}
.shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);
  margin:22px auto 0;display:block;transition:transform .14s var(--ease);}
.shutter:active{transform:scale(.9);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px;}
.mday{aspect-ratio:1;display:grid;place-items:center;font-size:13.5px;border-radius:10px;
  position:relative;transition:background .16s;}
.mday:active{background:var(--card2);}
.mday.head{color:var(--text2);font-size:11.5px;font-weight:600;}
.mday.dim{color:var(--text3);}
.mday.today{background:var(--tint);color:#fff;font-weight:600;}
.mday.has::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--orange);}
.mday.today.has::after{background:#fff;}
.progressbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;position:relative;}
.progressbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--tint);border-radius:3px;transition:width .25s linear;}
.hidden{display:none !important;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}

const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, "0");

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const NOW = Date.now(), MIN = 60000, HR = 3600000, DAY = 86400000;

function fmtTime(ts) { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fmtDay(ts) { const d = new Date(ts); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function fmtRel(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return "刚刚";
  if (diff < HR) return Math.floor(diff / MIN) + "分钟前";
  if (diff < DAY) return Math.floor(diff / HR) + "小时前";
  if (diff < DAY * 7) return Math.floor(diff / DAY) + "天前";
  return fmtDay(ts);
}

const STORE_KEY = "xingyu.phone.data";

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object" && over && typeof over === "object") {
    const out = {};
    Object.keys(base).forEach(k => { out[k] = Object.prototype.hasOwnProperty.call(over, k) ? deepMerge(base[k], over[k]) : base[k]; });
    Object.keys(over).forEach(k => { if (!Object.prototype.hasOwnProperty.call(base, k)) out[k] = over[k]; });
    return out;
  }
  return over === undefined ? base : over;
}

    if (!d.story) d.story = clone(DEFAULT_DATA.story);
    if (!d.recordings) d.recordings = [];
    if (!d.sms) d.sms = clone(DEFAULT_DATA.sms);
    v = 3;
  }
  d.v = DATA_VERSION;
  return d;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return clone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return clone(DEFAULT_DATA);
    return migrate(deepMerge(clone(DEFAULT_DATA), parsed));
  } catch (e) {
    console.warn("数据读取失败，使用默认数据", e);
    return clone(DEFAULT_DATA);
  }
}

}
let audioCtx = null;
function beep(freq = 660, dur = 0.05, vol = 0.035) {
  if (!D.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function toast(msg, ms = 1900) {

}

function ripple(el, e) {
  if (reducedMotion()) return;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const d = Math.max(r.width, r.height);
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = d + "px";
  span.style.left = (e.clientX - r.left - d / 2) + "px";
  span.style.top = (e.clientY - r.top - d / 2) + "px";
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  el.appendChild(span);
  setTimeout(() => span.remove(), 620);
}

   6. 路由
   ========================================================= */
const Router = {
  stack: [],
  push(key, renderFn) {
    const el = document.createElement("div");
    el.className = "page";
    const rec = { key, render: renderFn, el };
    const prev = this.top();
    $("#pages-layer").appendChild(el);
    this.stack.push(rec);
    this.paint(rec);
    void el.offsetWidth;
    requestAnimationFrame(() => {
      el.classList.add("in");
      if (prev) { prev.el.classList.add("behind"); prev.el.style.pointerEvents = "none"; }
    });
    return rec;
  },
  top() { return this.stack[this.stack.length - 1]; },
  paint(rec) {
    rec.el.innerHTML = rec.render();
    const scroller = rec.el.querySelector(".chat-scroll");
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  },
  refresh() { const rec = this.top(); if (rec) this.paint(rec); },
  pop() {
    const rec = this.stack.pop();
    if (!rec) return false;
    rec.el.classList.remove("in");
    rec.el.classList.add("out");
    const prev = this.top();
    if (prev) { prev.el.classList.remove("behind"); prev.el.style.pointerEvents = ""; }
    setTimeout(() => rec.el.remove(), 320);
    return true;
  },
  home() {
    this.stack.forEach(r => r.el.remove());
    this.stack = [];
  }
};

function chatView(id) {

    if (m.type === "image") inner = `<div class="bubble img" style="background:linear-gradient(135deg,hsl(210 70% 60%),hsl(280 70% 55%))"></div>`;
    else if (m.type === "voice") inner = `<div class="bubble">🎙 语音 ${m.text || "0:05"}<div class="meta">${fmtTime(m.ts)}</div></div>`;
    else if (m.type === "transfer") inner = `<div class="bubble">💸 转账 ¥${esc(m.text)}<div class="meta">${fmtTime(m.ts)}</div></div>`;
    else inner = `<div class="bubble">${esc(m.text)}<div class="meta">${fmtTime(m.ts)}${mine ? " · " + (m.status || "已发送") : ""}</div></div>`;

function appClock() {

  return nav("时钟") + body(`

        return `<div class="list-item"><div class="li-main"><div class="li-title">${n}</div>
          <div class="li-sub">${off === 0 ? "本地时间" : (off > 0 ? "+" + off : off) + " 小时"}</div></div>
          <div style="font-size:22px;font-weight:300">${pad(d.getHours())}:${pad(d.getMinutes())}</div></div>`;
      }).join("")}
    </div>

    <div class="section-title">秒表</div>
    <div class="list" style="padding:18px;text-align:center">
      <div style="font-size:38px;font-weight:250;letter-spacing:1px;font-variant-numeric:tabular-nums">${fmtMs(elapsed)}</div>
      <div class="row" style="justify-content:center;gap:12px;margin-top:14px">
        <button class="btn ${sw.running ? "danger" : "primary"}" data-action="swToggle">${sw.running ? "暂停" : "开始"}</button>
        <button class="btn ghost" data-action="swReset">重置</button>
      </div>
    </div>

    <div class="section-title">计时器</div>
    <div class="list" style="padding:18px;text-align:center">
      <div style="font-size:38px;font-weight:250;font-variant-numeric:tabular-nums" id="timer-display">${fmtMs(tmr.remain)}</div>
      <div class="row" style="justify-content:center;gap:10px;margin-top:14px">
        <button class="btn ghost sm" data-action="timerSet" data-min="1">1分钟</button>
        <button class="btn ghost sm" data-action="timerSet" data-min="5">5分钟</button>
        <button class="btn ghost sm" data-action="timerSet" data-min="10">10分钟</button>
      </div>
      <div class="row" style="justify-content:center;gap:12px;margin-top:12px">
        <button class="btn ${tmr.running ? "danger" : "primary"}" data-action="timerToggle">${tmr.running ? "停止" : "开始"}</button>
        <button class="btn ghost" data-action="timerReset">重置</button>
      </div>
    </div>
  `);
}
function fmtMs(ms) {
  ms = Math.max(0, ms);
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), c = Math.floor((ms % 1000) / 10);
  return pad(m) + ":" + pad(s) + "." + pad(c);
}
ACTIONS.swToggle = () => {
  const sw = S.stopwatch;
  if (sw.running) { sw.elapsed += Date.now() - sw.start; sw.running = false; clearInterval(sw.timer); }
  else {
    sw.start = Date.now(); sw.running = true;
    sw.timer = setInterval(() => {
      const d = $("#timer-display");
      const el = document.querySelectorAll(".list")[1];
      if (el) { const disp = el.querySelector("div[style*='font-size:38px']"); if (disp) disp.textContent = fmtMs(sw.elapsed + Date.now() - sw.start); }
    }, 60);
  }
  Router.refresh();
};
ACTIONS.swReset = () => {
  const sw = S.stopwatch;
  sw.running = false; clearInterval(sw.timer); sw.elapsed = 0;
  Router.refresh();
};
ACTIONS.timerSet = el => {
  S.timer.remain = Number(el.dataset.min) * 60000;
  Router.refresh();
};
ACTIONS.timerToggle = () => {
  const t = S.timer;
  if (t.running) { clearInterval(t.timer); t.running = false; }
  else {
    if (t.remain <= 0) t.remain = 60000;
    t.running = true;
    const end = Date.now() + t.remain;
    t.timer = setInterval(() => {
      t.remain = end - Date.now();
      const d = document.getElementById("timer-display");
      if (d) d.textContent = fmtMs(t.remain);
      if (t.remain <= 0) {
        clearInterval(t.timer); t.running = false; t.remain = 0;
        toast("⏰ 计时结束");
        beep(880, 0.15, 0.08);
        Router.refresh();
      }
    }, 100);
  }
  Router.refresh();
};
ACTIONS.timerReset = () => {
  clearInterval(S.timer.timer);
  S.timer.running = false; S.timer.remain = 0;
  Router.refresh();
};

/* =========================================================
   15. 日历
   ========================================================= */
function appCalendar() {
  const cur = S.calMonth;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const todayStr = isoDate(new Date());
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push({ d: prevDays - startDow + i + 1, dim: true });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ d: i, dim: false });
  while (cells.length % 7 !== 0) cells.push({ d: cells.length - startDow - daysInMonth + 1, dim: true });

  const dayEvents = D.events.filter(e => e.date === S.calSelected);

  return nav("日历", {
    right: `<button class="nav-btn" data-action="addEvent" aria-label="添加事件">${ic("plus")}</button>`
  }) + body(`
    <div class="row" style="padding:0 16px 10px">
      <button class="btn ghost sm" data-action="calPrev">‹</button>
      <div style="flex:1;text-align:center;font-size:16px;font-weight:600">${y} 年 ${m + 1} 月</div>
      <button class="btn ghost sm" data-action="calNext">›</button>
    </div>
    <div class="month-grid">
      ${["日", "一", "二", "三", "四", "五", "六"].map(d => `<div class="mday head">${d}</div>`).join("")}
      ${cells.map(c => {
        const ds = `${y}-${pad(m + 1)}-${pad(c.d)}`;
        const isToday = !c.dim && ds === todayStr;
        const has = D.events.some(e => e.date === ds);
        return `<div class="mday ${c.dim ? "dim" : ""} ${isToday ? "today" : ""} ${has ? "has" : ""}"
          data-action="calPick" data-date="${ds}">${c.d}</div>`;
      }).join("")}
    </div>
    <div class="section-title">${esc(S.calSelected)} 的日程</div>
    <div class="list">
      ${dayEvents.length ? dayEvents.map(e => `<div class="list-item">
        <div class="li-main"><div class="li-title">${esc(e.title)}</div><div class="li-sub">${esc(e.time || "全天")}</div></div>
        <button class="btn ghost sm" data-action="delEvent" data-id="${e.id}">删除</button>
      </div>`).join("") : `<div class="empty" style="padding:26px">这一天还没有安排</div>`}
    </div>
  `);
}

function appCalculator() {
  const keys = [
    ["AC", "fn"], ["⌫", "fn"], ["%", "fn"], ["÷", "op"],
    ["7", ""], ["8", ""], ["9", ""], ["×", "op"],
    ["4", ""], ["5", ""], ["6", ""], ["−", "op"],
    ["1", ""], ["2", ""], ["3", ""], ["+", "op"],
    ["0", "", "span2"], [".", ""], ["=", "op"]
  ];
  return nav("计算器") + body(`
    <div class="calc-display" id="calc-display">${esc(S.calcDisplay)}</div>
    <div class="calc-pad">
      ${keys.map(k => `<button class="calc-key ${k[1]}" style="${k[2] === "span2" ? "grid-column:span 2" : ""}"
        data-action="calcKey" data-k="${esc(k[0])}">${esc(k[0])}</button>`).join("")}
    </div>
  `, "");
}
ACTIONS.calcKey = el => {
  const k = el.dataset.k;
  let expr = S.calcExpr;
  if (k === "AC") { S.calcExpr = ""; S.calcDisplay = "0"; Router.refresh(); return; }
  if (k === "⌫") {
    S.calcExpr = expr.slice(0, -1);
    S.calcDisplay = S.calcExpr || "0";
    Router.refresh(); return;
  }
  if (k === "=") {
    try {
      const result = evalExpr(S.calcExpr);
      S.calcDisplay = String(result);
      S.calcExpr = String(result);
    } catch (e) {
      S.calcDisplay = "错误";
      S.calcExpr = "";
    }
    Router.refresh(); return;
  }
  const map = { "÷": "/", "×": "*", "−": "-" };
  S.calcExpr += map[k] || k;
  S.calcDisplay = S.calcExpr;
  Router.refresh();
};
function evalExpr(expr) {
  if (!expr) return 0;
  const clean = expr.replace(/%/g, "/100");
  if (!/^[0-9+\-*/().\s]+$/.test(clean)) throw new Error("表达式非法");
  const v = Function('"use strict";return (' + clean + ")")();
  if (typeof v !== "number" || !isFinite(v)) throw new Error("结果非法");
  return Math.round(v * 1e10) / 1e10;
}

ACTIONS.gameStart = () => {
  if (S.game.running) return;
  S.game.running = true;
  S.game.score = 0;
  const area = $("#game-area");
  const startBtn = $("#game-start");
  if (startBtn) startBtn.remove();
  const scoreEl = $("#game-score");
  let timeLeft = 20;
  const timerEl = document.createElement("div");
  timerEl.style.cssText = "position:absolute;top:8px;left:12px;font-size:12px;color:var(--text2)";
  timerEl.textContent = "剩余 20s";
  area.appendChild(timerEl);

  const spawn = () => {
    if (!S.game.running) return;
    const b = document.createElement("button");
    const size = 34 + Math.random() * 22;
    b.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;
      background:radial-gradient(circle at 30% 30%,#7ad6ff,#0a84ff);left:${Math.random() * (area.clientWidth - size)}px;
      top:${Math.random() * (area.clientHeight - size)}px;transition:transform .12s;`;
    b.onclick = ev => {
      ev.stopPropagation();
      if (!S.game.running) return;
      S.game.score++;
      if (scoreEl) scoreEl.textContent = S.game.score;
      beep(880, 0.04);
      b.remove();
      spawn();
    };
    area.appendChild(b);
    setTimeout(() => b.remove(), 900);
  };
  spawn();
  const iv = setInterval(spawn, 520);
  const cd = setInterval(() => {
    timeLeft--;
    timerEl.textContent = "剩余 " + timeLeft + "s";
    if (timeLeft <= 0) {
      clearInterval(iv); clearInterval(cd);
      S.game.running = false;
      S.game.best = Math.max(S.game.best, S.game.score);
      area.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--text2)">
        得分 ${S.game.score} · 点击重新开始</div>`;
      area.onclick = () => { area.onclick = null; Router.refresh(); };
      toast("游戏结束，得分 " + S.game.score);
    }
  }, 1000);
};

function tickClock() {
  const d = new Date();
  const t = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const dateStr = `${d.getMonth() + 1}月${d.getDate()}日 星期${"日一二三四五六"[d.getDay()]}`;

/* =========================================================
   33. 手势
   ========================================================= */
let gp = null;
const screenEl = () => $("#screen");

screenEl().addEventListener("pointerdown", e => {
  if (e.target.closest(".modal-wrap, input, textarea, [contenteditable]")) { gp = null; return; }
  const r = screenEl().getBoundingClientRect();
  gp = { x0: e.clientX - r.left, y0: e.clientY - r.top, W: r.width, H: r.height };
}, true);

screenEl().addEventListener("pointerup", e => {
  if (!gp) return;
  const r = screenEl().getBoundingClientRect();
  const dx = (e.clientX - r.left) - gp.x0;
  const dy = (e.clientY - r.top) - gp.y0;
  handleGesture(dx, dy, gp);
  gp = null;
}, true);

function handleGesture(dx, dy, g) {
  if (Math.abs(dy) < 12 && Math.abs(dx) < 12) return;

  // 顶部下拉：通知中心 / 控制中心
  if (g.y0 < 30 && dy > 46 && Math.abs(dy) > Math.abs(dx)) {
    if (g.x0 > g.W * 0.55) openCC(); else openNC();
    return;
  }
  // 左边缘右滑：返回
  if (g.x0 < 26 && dx > 62 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (S.notifOpen || S.ccOpen) { closeNC(); closeCC(); return; }
    if (Router.stack.length) { Router.pop(); return; }
  }
  // 底部上滑：回到主屏幕
  if (g.y0 > g.H - 34 && dy < -46 && Math.abs(dy) > Math.abs(dx)) {
    if (Router.stack.length) Router.home();
    return;
  }
}

/* 桌面翻页 */
(function bindPageSwipe() {
  const dp = $("#dpages");
  let dragging = false, startX = 0, startY = 0, dx = 0, w = 390;
  const onDown = e => {
    if (S.locked) return;
    if (e.target.closest("input,textarea")) return;
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0;
    w = screenEl().clientWidth || 390;
    dp.classList.add("dragging");
    dp.setPointerCapture && dp.setPointerCapture(e.pointerId);
  };
  const onMove = e => {
    if (!dragging) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) { dragging = false; dp.classList.remove("dragging"); return; }
    let base = -S.page * w;
    let offset = dx;
    if ((S.page === 0 && dx > 0) || (S.page === HOME_PAGES.length - 1 && dx < 0)) offset = dx * 0.32;
    dp.style.transform = `translateX(${base + offset}px)`;
  };
  const onUp = () => {
    if (!dragging) { dp.classList.remove("dragging"); return; }
    dragging = false;
    dp.classList.remove("dragging");
    if (dx < -60 && S.page < HOME_PAGES.length - 1) S.page++;
    else if (dx > 60 && S.page > 0) S.page--;
    updatePageTransform();
    $$("#dots .dot-ind").forEach((d, i) => d.classList.toggle("on", i === S.page));
  };
  dp.addEventListener("pointerdown", onDown);
  dp.addEventListener("pointermove", onMove);
  dp.addEventListener("pointerup", onUp);
  dp.addEventListener("pointercancel", onUp);
})();

/* 锁屏滑动 / 点击解锁 */
(function bindLock() {
  const ls = $("#lock-screen");
  let y0 = null;
  ls.addEventListener("pointerdown", e => {
    if (e.target.closest("#lock-keypad")) return;
    y0 = e.clientY;
  });
  ls.addEventListener("pointerup", e => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    if (dy < -36) tryUnlock();
    y0 = null;
  });
  ls.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    tryUnlock();
  });
})();

    { label: "删除评论", fn: () => confirmBox("删除评论", "确定删除这条评论吗？", "删除", () => {
        p.comments = p.comments.filter(x => x.id !== cid);
        save(); Router.refresh(); toast("已删除");
      }) }
  ]);
};

/* =========================================================
   35. 剧情引擎
   ========================================================= */
const Story = {
  trigger(evt) {
    try {
      const st = D.story;
      if (!st || !st.enabled || !st.story || !Array.isArray(st.story.nodes)) return;
      st.nodes.forEach(node => {
        if (!node || !node.on) return;
        if (node.once && st.done.includes(node.id)) return;
        if (!this.match(node.on, evt)) return;
        st.done.push(node.id);
        st.log.push({ id: node.id, ts: Date.now() });
        this.run(node.actions || []);
        save();
      });
    } catch (e) { console.warn("剧情执行出错", e); }
  },
  match(cond, evt) {
    if (!cond || cond.type !== evt.type) return false;
    if (cond.type === "appOpen") return !cond.app || cond.app === evt.app;
    if (cond.type === "post") return true;
    if (cond.type === "choice") return true;
    return true;
  },
  run(actions) {
    (actions || []).forEach(act => {
      try {
        if (act.type === "notify") {
          D.notifications.unshift({ id: uid(), app: act.app || "system", title: act.title || "系统", body: act.body || "", ts: Date.now() });
          renderLockNotifs();
          toast(act.title ? act.title + "：" + (act.body || "") : act.body || "新通知");
        } else if (act.type === "addMessage") {
          const c = D.chats.find(x => x.id === act.chatId) || D.chats[0];
          if (c) {
            c.msgs.push({ id: uid(), from: act.from || "them", type: "text", text: act.text || "", ts: Date.now(), status: "已发送" });
            c.unread = (c.unread || 0) + 1;
          }
        } else if (act.type === "setVar") {
          D.story.vars[act.key] = act.value;
        } else if (act.type === "openApp") {
          setTimeout(() => openApp(act.app), 300);
        } else if (act.type === "delay") {
          setTimeout(() => this.run(act.actions || []), act.ms || 1000);
        } else if (act.type === "choice") {
          setTimeout(() => {
            sheet((act.options || []).map(o => ({
              label: o.text,
              fn: () => this.run(o.actions || [])
            })));
          }, 260);
        }
      } catch (e) { console.warn("剧情动作出错", e); }
    });
  }
};

ACTIONS.devToggleStory = () => {
  D.story.enabled = !D.story.enabled;
  save(); Router.refresh();
  toast(D.story.enabled ? "剧情引擎已开启" : "剧情引擎已关闭");
};
ACTIONS.devEditStory = () => {
  modal(`<h3 class="m-title">剧情 JSON</h3>

      <button class="btn ghost" data-action="closeModal">取消</button>

    </div>`);

    } catch (e) { toast("JSON 错误：" + e.message); }
  };
};
ACTIONS.devTestStory = () => { Story.trigger({ type: "unlock" }); toast("已触发 unlock 事件"); };
ACTIONS.devVars = () => {
  modal(`<h3 class="m-title">剧情变量</h3>
    <pre style="font-size:12px;color:var(--text2);white-space:pre-wrap;margin:0">${esc(JSON.stringify(D.story.vars || {}, null, 2))}</pre>

};
ACTIONS.devResetStory = () => {

    D.story.done = [];
    D.story.vars = {};
    D.story.log = [];
    save(); Router.refresh(); toast("剧情状态已重置");
  });
};
ACTIONS.devEditData = () => {
  modal(`<h3 class="m-title">编辑数据 JSON</h3>
    <textarea class="field" rows="10" id="dev-json">${esc(JSON.stringify(D, null, 2))}</textarea>
    <div class="m-actions">
      <button class="btn ghost" data-action="closeModal">取消</button>
      <button class="btn primary" id="dev-save">保存</button>
    </div>`);
  $("#dev-save").onclick = () => {
    try {
      const parsed = JSON.parse($("#dev-json").value);
      if (!parsed || typeof parsed !== "object") throw new Error("格式错误");
      D = migrate(deepMerge(clone(DEFAULT_DATA), parsed));
      save(true); applyTheme(); applyFontSize(); applyWallpaper();
      closeModal(); Router.refresh(); toast("已保存");
    } catch (e) { toast("保存失败：" + e.message); }
  };
};
ACTIONS.devClearStorage = () => {
  confirmBox("清除本地存储", "将会删除本机保存的所有数据。", "清除", () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    D = clone(DEFAULT_DATA);
    save(true); applyTheme(); applyFontSize(); applyWallpaper();
    Router.home(); toast("已清除");
  });
};

/* =========================================================
   37. 初始化
   ========================================================= */
function fitPhone() {
  const p = $("#phone");
  if (!p) return;
  if (window.innerWidth <= 520) { p.style.transform = ""; return; }
  const s = Math.min(1, (window.innerHeight - 40) / 844, (window.innerWidth - 40) / 390);
  p.style.transform = `scale(${s})`;
}

function boot() {
  applyTheme();
  applyFontSize();
  applyWallpaper();
  renderHome();
  renderLockNotifs();
  tickClock();
  setInterval(tickClock, 1000);
  fitPhone();
  window.addEventListener("resize", () => { fitPhone(); updatePageTransform(); });

  $("#screen").style.filter = `brightness(${0.55 + D.settings.brightness / 100 * 0.45})`;

  if (D.settings.passcodeOn) {
    setTimeout(() => toast("提示：默认锁屏密码为 1234", 2600), 800);
  }

  // 全局错误捕获
  window.addEventListener("error", e => {
    console.error(e.error || e.message);
  });
  window.addEventListener("unhandledrejection", e => {
    console.error("Promise 错误", e.reason);
  });
}

boot();
</script>
